# Google Cloud Build pipeline for CorexStack (customized CloudBeaver).
#
# Builds the overlay image, pushes it to Artifact Registry, and deploys to Cloud Run.
#
# Submit from the repo root:
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_REGION=europe-southwest1,_SERVICE=corexstack,_REPO=corexstack
#
# Requires (one-time), see deploy/cloudrun/README.md:
#   - Artifact Registry repo `${_REPO}` in `${_REGION}`
#   - APIs enabled: run, cloudbuild, artifactregistry
#   - Cloud Build service account granted roles/run.admin + roles/iam.serviceAccountUser

substitutions:
  _REGION: europe-southwest1
  _SERVICE: corexstack
  _REPO: corexstack
  _CB_VERSION: '26.1.0'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'

steps:
  # 1. Build the image (context = ./webapp)
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/cloudrun/Dockerfile
      - --build-arg=CB_VERSION=${_CB_VERSION}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - ./webapp

  # 2. Push both tags
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  # 3. Deploy to Cloud Run
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --execution-environment=gen2
      - --cpu=2
      - --memory=2Gi
      - --cpu-boost
      - --min-instances=1
      - --max-instances=1
      - --timeout=3600
      - --set-env-vars=CLOUDBEAVER_WEB_SERVER_PORT=8080

timeout: 2400s
